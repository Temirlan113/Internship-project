

services:
  postgres:
    image: postgres:16-alpine
    container_name: main-service-db
    environment:
      POSTGRES_DB: internship-project-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: satorugod1
    ports:
      - "5432:5432"

  main-service:
    build: .
    container_name: main-service-app
    ports:
      - "8083:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/internship-project-db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: satorugod1
      KEYCLOAK_URL: http://keycloak:8080
      MINIO_URL: http://minio-service:9000
    depends_on:
       postgres:
          condition: service_started
       keycloak:
         condition: service_healthy
       minio-service:
         condition: service_healthy




  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    container_name: keycloak-app
    environment:
      - KC_DB=postgres
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak


    command: ["start-dev", "--import-realm"]

    volumes:
      - ./user-service.json:/opt/keycloak/data/import/user-service.json:ro

    ports:
      - "8084:8080"

    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/master HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s


    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db-container
    environment:
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak
      - POSTGRES_DB=keycloak
    ports:
      - "5444:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
          test: [ "CMD-SHELL", "pg_isready -U keycloak -d keycloak" ]
          interval: 5s
          timeout: 5s
          retries: 5

  minio-service:
    image: quay.io/minio/minio
    container_name: 'minio_service_container'
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin1234
    volumes:
        - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc
    container_name: minio-setup-container
    environment:
      MC_HOST: http://admin:admin1234@minio-service:9000
      depends_on:
        minio-service
      condition: service_healthy

    entrypoint: >
      /bin/sh -c "
            echo 'Waiting for MinIO server to be fully ready...';
            until mc alias set minio-service http://minio-service:9000 admin admin1234; do
              echo 'MinIO is not ready yet, retrying in 2 seconds...';
              sleep 2;
            done;
            echo 'Creating bucket...';
            mc mb --ignore-existing minio-service/dev-bucket;
            echo 'Bucket created successfully!';
            exit 0;
            "

volumes:
  postgres_data:
  minio_data: