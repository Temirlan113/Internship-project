spring.application.name=main-service
server.port=8085

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:internship-project-db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

keycloak.url=${KEYCLOAK_URL:http://localhost:8084}
keycloak.realm=user-service
keycloak.client-id=user-service-client
keycloak.username=${KEYCLOAK_ADMIN_USER:admin}
keycloak.password=${KEYCLOAK_ADMIN_PASS}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}



spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.url}/realms/${keycloak.realm}
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true


minio.url=${MINIO_URL:http://localhost:9000}
minio.user=${MINIO_ROOT_USER:admin}
minio.password=${MINIO_ROOT_PASS}
minio.bucket=dev-bucket

spring.servlet.multipart.max-file-size=10MB

spring.jpa.show-sql=true

logging.level.root = INFO
logging.level.com.kz.internship_project=DEBUG

logging.level.org.hibernate.sql=DEBUG
logging.file.name=logs/app.log


logging.level.liquibase=DEBUG
logging.level.org.liquibase=DEBUG

