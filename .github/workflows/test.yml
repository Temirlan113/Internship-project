name: Integration Tests

on:
  push:
    branches: [ "main", "fix/tests" ]
  pull_request:
    branches: [ "main", "fix/tests" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать код из репозитория
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Дать права на исполнение gradlew
        run: chmod +x gradlew

      # Добавляем шаг предварительного pull образ(ов)
      - name: Предварительно скачать Docker образ
        run: |
          docker pull postgres:15-alpine
          docker pull minio/minio:latest

      - name: Запустить интеграционные тесты
        run: ./gradlew test