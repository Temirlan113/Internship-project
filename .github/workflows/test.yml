name: Integration Tests

on:
  push:
    branches: [ "main", "fix/tests" ]
  pull_request:
    branches: [ "main", "fix/tests" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: internship-project-db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: satorugod1
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: quay.io/minio/minio:RELEASE.2024-11-07T00-52-19Z
        env:
          MINIO_ROOT_USER: admin
          MINIO_ROOT_PASSWORD: admin1234
        ports:
          - 9000:9000
        command: server /data

    steps:
      - name: Скачать код из репозитория
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Дать права на исполнение gradlew
        run: chmod +x gradlew

      - name: Запустить интеграционные тесты
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          TESTCONTAINERS_CHECKS_DISABLE: "true"
        run: ./gradlew test --stacktrace